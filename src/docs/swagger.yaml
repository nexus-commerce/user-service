basePath: /api
definitions:
  http.confirmEmailChangeRequest:
    properties:
      token:
        type: string
    type: object
  http.confirmRegistrationRequest:
    properties:
      token:
        type: string
    type: object
  http.confirmRegistrationResponse:
    properties:
      token:
        type: string
    type: object
  http.errorResponse:
    properties:
      error:
        type: string
    type: object
  http.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  http.loginResponse:
    properties:
      token:
        type: string
    type: object
  http.registerRequest:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      password:
        type: string
      passwordConfirmation:
        type: string
    type: object
  http.renameRequest:
    properties:
      firstName:
        type: string
      lastName:
        type: string
    type: object
  http.requestEmailChangeRequest:
    properties:
      newEmail:
        type: string
      password:
        type: string
    type: object
  http.userEnvelope:
    properties:
      user:
        $ref: '#/definitions/http.userResponse'
    type: object
  http.userResponse:
    properties:
      email:
        type: string
      firstName:
        type: string
      id:
        type: string
      lastName:
        type: string
    type: object
info:
  contact: {}
  description: This is the API documentation for the User Service
  title: User Service API
  version: 0.1.0
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user by email and password and returns a JWT token
      parameters:
      - description: User credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.loginResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/http.errorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/http.errorResponse'
        "413":
          description: Request body too large
          schema:
            $ref: '#/definitions/http.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.errorResponse'
      summary: Login
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: 'Starts a sign-up: sends a confirmation link to a new email or
        an "account already exists" notice to a registered one. The response does
        not reveal which.'
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.registerRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
        "400":
          description: Invalid request, empty or too long fields, too short password,
            malformed email or passwords do not match
          schema:
            $ref: '#/definitions/http.errorResponse'
        "413":
          description: Request body too large
          schema:
            $ref: '#/definitions/http.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.errorResponse'
      summary: Register
      tags:
      - Auth
  /auth/register/confirm:
    post:
      consumes:
      - application/json
      description: Confirms a pending registration with the token from the confirmation
        link, creates the user account, publishes a user.registered event and returns
        a JWT token
      parameters:
      - description: Confirmation token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.confirmRegistrationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.confirmRegistrationResponse'
        "400":
          description: Invalid request, invalid, already used or expired confirmation
            link
          schema:
            $ref: '#/definitions/http.errorResponse'
        "409":
          description: User with this email already exists
          schema:
            $ref: '#/definitions/http.errorResponse'
        "413":
          description: Request body too large
          schema:
            $ref: '#/definitions/http.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.errorResponse'
      summary: Confirm registration
      tags:
      - Auth
  /docs:
    get:
      description: Serves the interactive API reference UI
      produces:
      - text/html
      responses:
        "200":
          description: HTML page
          schema:
            type: string
        "401":
          description: Missing or invalid credentials
          schema:
            $ref: '#/definitions/http.errorResponse'
      security:
      - BasicAuth: []
      summary: API Documentation
      tags:
      - System
  /docs/asyncapi:
    get:
      description: Serves the interactive AsyncAPI reference UI for the events this
        service publishes
      produces:
      - text/html
      responses:
        "200":
          description: HTML page
          schema:
            type: string
        "401":
          description: Missing or invalid credentials
          schema:
            $ref: '#/definitions/http.errorResponse'
      security:
      - BasicAuth: []
      summary: Events Documentation
      tags:
      - System
  /docs/asyncapi.yaml:
    get:
      description: Serves the AsyncAPI specification of the events this service publishes
      produces:
      - application/yaml
      responses:
        "200":
          description: AsyncAPI 3.0 specification
          schema:
            type: string
        "401":
          description: Missing or invalid credentials
          schema:
            $ref: '#/definitions/http.errorResponse'
      security:
      - BasicAuth: []
      summary: Events Specification
      tags:
      - System
  /docs/swagger.json:
    get:
      description: Serves the Swagger specification used by the API reference UI
      produces:
      - application/json
      responses:
        "200":
          description: Swagger 2.0 specification
          schema:
            type: object
        "401":
          description: Missing or invalid credentials
          schema:
            $ref: '#/definitions/http.errorResponse'
      security:
      - BasicAuth: []
      summary: API Specification
      tags:
      - System
  /health:
    get:
      description: Returns 200 OK when the service is healthy
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Health Check
      tags:
      - System
  /users/email/confirm:
    post:
      consumes:
      - application/json
      description: Confirms a pending email change with the token from the confirmation
        link and makes the new email current
      parameters:
      - description: Confirmation token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.confirmEmailChangeRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid request, invalid, already used or expired confirmation
            link
          schema:
            $ref: '#/definitions/http.errorResponse'
        "409":
          description: User with this email already exists
          schema:
            $ref: '#/definitions/http.errorResponse'
        "413":
          description: Request body too large
          schema:
            $ref: '#/definitions/http.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.errorResponse'
      summary: Confirm email change
      tags:
      - Users
  /users/me:
    get:
      description: Returns the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.userEnvelope'
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/http.errorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/http.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.errorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Users
  /users/me/email:
    post:
      consumes:
      - application/json
      description: Starts an email change for the authenticated user; the new email
        takes effect only after it is confirmed via the link sent to it. If the new
        email already belongs to another account, the response is the same and that
        address gets a notice instead of a link
      parameters:
      - description: New email and current password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.requestEmailChangeRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
        "400":
          description: Invalid request, malformed email or email equal to the current
            one
          schema:
            $ref: '#/definitions/http.errorResponse'
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/http.errorResponse'
        "403":
          description: Invalid password
          schema:
            $ref: '#/definitions/http.errorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/http.errorResponse'
        "413":
          description: Request body too large
          schema:
            $ref: '#/definitions/http.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.errorResponse'
      security:
      - BearerAuth: []
      summary: Request email change
      tags:
      - Users
  /users/me/name:
    patch:
      consumes:
      - application/json
      description: Partially changes the first and last name of the authenticated
        user; only provided fields are changed
      parameters:
      - description: Fields to change
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.renameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.userEnvelope'
        "400":
          description: Invalid request, empty or too long fields
          schema:
            $ref: '#/definitions/http.errorResponse'
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/http.errorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/http.errorResponse'
        "413":
          description: Request body too large
          schema:
            $ref: '#/definitions/http.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.errorResponse'
      security:
      - BearerAuth: []
      summary: Rename user
      tags:
      - Users
securityDefinitions:
  BasicAuth:
    type: basic
  BearerAuth:
    description: JWT token in the format "Bearer {token}"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
