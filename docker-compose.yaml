services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: user-service-dev
    container_name: user-service
    hostname: user-service
    networks:
      - user-service-network
      - ecommerce-network
    ports:
      - "80:80"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      KAFKA_HOST: kafka
      KAFKA_PORT: 29092
    restart: on-failure
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://localhost:80/api/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy

  outbox-relay:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: user-service-dev
    container_name: outbox-relay
    hostname: outbox-relay
    networks:
      - user-service-network
      - ecommerce-network
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      KAFKA_HOST: kafka
      KAFKA_PORT: 29092
    command: [ "air", "-c", ".air.relay.toml" ]
    restart: on-failure
    depends_on:
      user-service:
        condition: service_healthy
      postgres:
        condition: service_healthy

  registration-consumer:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: user-service-dev
    container_name: registration-consumer
    hostname: registration-consumer
    networks:
      - user-service-network
      - ecommerce-network
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      KAFKA_HOST: kafka
      KAFKA_PORT: 29092
    command: [ "air", "-c", ".air.consumer.toml" ]
    restart: on-failure
    depends_on:
      user-service:
        condition: service_healthy
      postgres:
        condition: service_healthy

  purge:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: user-service-dev
    container_name: purge
    hostname: purge
    networks:
      - user-service-network
      - ecommerce-network
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      KAFKA_HOST: kafka
      KAFKA_PORT: 29092
    command: [ "air", "-c", ".air.purge.toml" ]
    restart: on-failure
    depends_on:
      user-service:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15
    container_name: postgres
    hostname: postgres
    networks:
      - user-service-network
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_HOST_AUTH_METHOD: md5
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s

networks:
  user-service-network:
    driver: bridge
  ecommerce-network:
    external: true

volumes:
  postgres-data:
