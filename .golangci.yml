version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - funcorder
    - funlen
    - gocognit
    - gosec
    - misspell
    - noctx
    - rowserrcheck
    - sqlclosecheck
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.Rows).Close
  exclusions:
    rules:
      - path: internal/http/http\.go
        linters:
          - gosec
        text: G101
      - path: ^cmd/.+/main\.go$
        linters:
          - funlen

formatters:
  enable:
    - gofmt
    - goimports
